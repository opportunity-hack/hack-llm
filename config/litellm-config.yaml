# OHack Fall 2026 AI Gateway — LiteLLM routing config
#
# Teams see five self-describing model names (2026-10-04 rename; the old
# ohack/ohack-mid/ohack-frontier/ohack-free names still work via
# router_settings.model_group_alias below):
#   muse-spark, muse-wonder, kimi-k2.7-code, kimi-k3, gpt-oss-120b
#
# Pricing here is what budget math runs on — keep it matching the provider
# price sheets (verified 2026-08-17; muse-wonder verified 2026-10-13,
# sources in DECISIONS.md D4). All costs are
# USD per token (per-M price / 1,000,000).

model_list:
  # ── Lane 1 (default): Meta Muse Spark 1.3 Contributor — $0.10/$0.20 per M ──
  # (1.3 replaced 1.2 as the docs default 2026-09; same price, tuned for
  # agentic/coding — audit 2026-09-10.)
  # Contributor tier = Meta may train on prompts/completions (disclosed on the
  # team docs page) and is capped at 100 requests/min — the fallback chain below
  # absorbs event-scale bursts.
  # (was: ohack — renamed 2026-10-04, old name kept as alias)
  - model_name: muse-spark
    litellm_params:
      model: openai/muse-spark-1.3-contributor
      api_base: https://api.meta.ai/v1
      api_key: os.environ/META_MODEL_API_KEY
    model_info:
      input_cost_per_token: 1e-7    # $0.10 / M
      output_cost_per_token: 2e-7   # $0.20 / M
      cache_read_input_token_cost: 2e-9  # $0.002 / M cached input

  # ── Lane 3 (mid fallback): Moonshot Kimi K2.7 Code — $0.95/$4 per M ──
  # (was: ohack-mid — renamed 2026-10-04, old name kept as alias)
  - model_name: kimi-k2.7-code
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://api.moonshot.ai/v1
      api_key: os.environ/MOONSHOT_API_KEY
    model_info:
      input_cost_per_token: 9.5e-7  # $0.95 / M
      output_cost_per_token: 4e-6   # $4 / M
      cache_read_input_token_cost: 1.9e-7  # $0.19 / M cache hit

  # ── Lane 2 (frontier, per-team $20 cap enforced on the key): Meta Muse
  # Wonder — $4/$20 per M, $0.20/M cached input (added 2026-10-13, D4) ──
  # Released 2026-10-12 via the Meta Model API as muse-wonder-1.0: same
  # api.meta.ai base URL and META_MODEL_API_KEY as muse-spark, 1M-token
  # context, built for long-horizon agentic/coding work. There is NO
  # Contributor tier for Wonder (unlike muse-spark), so this is standard
  # pricing — at frontier rates the $20 Key 2 cap is the real guardrail.
  # Deliberately NOT in any fallbacks list: like kimi-k3, it fails closed
  # with budget_exceeded when a team's frontier budget is exhausted.
  # Muse Wonder Full (the larger sibling from the same launch) is NOT
  # available on the Meta Model API — it is Muse Code subscription-only —
  # so it deliberately has no entry here. Do not add a muse-wonder-full
  # block expecting the API to serve it.
  - model_name: muse-wonder
    litellm_params:
      model: openai/muse-wonder-1.0
      api_base: https://api.meta.ai/v1
      api_key: os.environ/META_MODEL_API_KEY
    model_info:
      input_cost_per_token: 4e-6    # $4 / M
      output_cost_per_token: 2e-5   # $20 / M
      cache_read_input_token_cost: 2e-7  # $0.20 / M cached input

  # ── Lane 2 (frontier, per-team $20 cap enforced on the key): Kimi K3 ──
  # Deliberately NOT in any fallbacks list: when a team's frontier budget is
  # exhausted this fails closed with a budget_exceeded error, per PLAN §Phase 2.
  # (was: ohack-frontier — renamed 2026-10-04, old name kept as alias)
  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://api.moonshot.ai/v1
      api_key: os.environ/MOONSHOT_API_KEY
    model_info:
      input_cost_per_token: 3e-6    # $3 / M
      output_cost_per_token: 1.5e-5 # $15 / M
      cache_read_input_token_cost: 3e-7  # $0.30 / M cache hit

  # ── Lane 4 (overflow): stacked free tiers ──
  # (was: ohack-free — renamed 2026-10-04, old name kept as alias)
  # Multiple entries under one model_name = load-balanced group.
  # GATE (PLAN §5): before the event, verify each provider's ToS permits
  # shared/pooled hackathon use; drop any that forbids it by deleting its block.
  # Model IDs below MUST be re-verified against each provider's /v1/models
  # during Phase 5 — free-tier catalogs churn.
  - model_name: gpt-oss-120b
    litellm_params:
      model: openai/openai/gpt-oss-120b   # groq model id is "openai/gpt-oss-120b"
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0
  # Cerebras: burst overflow only — free trial is $5/account and their ToS is
  # the strictest on credential sharing; key stays server-side in this gateway.
  # (zai-glm-4.7 was deprecated by Cerebras 2026-08-17 — audit 2026-09-10.)
  - model_name: gpt-oss-120b
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.cerebras.ai/v1
      api_key: os.environ/CEREBRAS_API_KEY
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0
  # NVIDIA NIM overflow — uncomment once key exists and ToS is verified:
  # - model_name: gpt-oss-120b
  #   litellm_params:
  #     model: openai/<pick from https://integrate.api.nvidia.com/v1/models>
  #     api_base: https://integrate.api.nvidia.com/v1
  #     api_key: os.environ/NVIDIA_NIM_API_KEY
  #   model_info:
  #     input_cost_per_token: 0
  #     output_cost_per_token: 0

router_settings:
  num_retries: 2
  # Old ohack-* names keep working (2026-10-04 rename); aliases are shown on
  # /v1/models by default.
  model_group_alias:
    "ohack": "muse-spark"
    "ohack-mid": "kimi-k2.7-code"
    "ohack-frontier": "kimi-k3"
    "ohack-free": "gpt-oss-120b"
  # Fallback fires after retries on 429/5xx. The frontier models
  # (kimi-k3 and muse-wonder) are intentionally absent. Note ohack-frontier
  # still aliases to kimi-k3, not muse-wonder: remapping it would silently
  # change the model (and price) for teams already using the old name.
  fallbacks:
    - muse-spark: ["kimi-k2.7-code", "gpt-oss-120b"]
    - kimi-k2.7-code: ["gpt-oss-120b"]

litellm_settings:
  telemetry: false          # PLAN §Phase 2: local-first, no telemetry upload
  drop_params: true         # heterogeneous coding tools send provider-specific params; drop, don't 400
  # NO token compression / prompt rewriting anywhere (PLAN §Phase 2: correctness > cost)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
